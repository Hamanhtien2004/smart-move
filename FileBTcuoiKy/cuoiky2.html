<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Liên hệ SmartMove để được hỗ trợ về dịch vụ di chuyển.">
    <title>Liên Hệ - SmartMove</title>
    <link rel="stylesheet" href="cuoiky.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>
    <script src="cuoiky.js" defer></script>
</head>
<body>
    <header>
        <a class="logo" href="cuoiky.html">Smart<span>Move</span></a>
        <nav aria-label="Điều hướng chính">
            <ul class="menu">
                <li><a href="cuoiky.html">Trang Chủ</a></li>
                <li><a href="cuoiky3.html">Đặt Xe</a></li>
                <li><a href="cuoiky1.html">Thành Viên</a></li>
                <li><a href="cuoiky2.html" class="active" aria-current="page">Liên Hệ</a></li>
                <li><button id="openLoginModal" class="login-nav-button" type="button">Đăng nhập</button></li>
            </ul>
        </nav>
    </header>

    <main class="page-content bg-gray">
        <section class="form-wrapper" aria-labelledby="contactHeading">
            <h1 id="contactHeading" class="section-title">Gửi Yêu Cầu Hỗ Trợ</h1>

            <form id="contactForm" novalidate>
                <div class="input-group">
                    <label for="fullname">Họ và tên</label>
                    <input id="fullname" name="fullname" type="text"
                           autocomplete="name" placeholder="Nhập họ và tên" required>
                    <span id="nameError" class="error-msg" aria-live="polite"></span>
                </div>

                <div class="input-group">
                    <label for="phone">Số điện thoại</label>
                    <input id="phone" name="phone" type="tel" inputmode="numeric"
                           autocomplete="tel" placeholder="Nhập số điện thoại 10 chữ số" required>
                    <span id="phoneError" class="error-msg" aria-live="polite"></span>
                </div>

                <div class="input-group">
                    <label for="message">Nội dung cần hỗ trợ</label>
                    <textarea id="message" name="message" rows="5"
                              placeholder="Bạn cần hỗ trợ gì?" required></textarea>
                    <span id="msgError" class="error-msg" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn-submit">Gửi Thông Tin</button>
            </form>
        </section>

        <div id="loginModal" class="modal" role="dialog" aria-modal="true"
             aria-labelledby="loginTitle" aria-hidden="true">
            <div class="modal-content login-form">
                <button id="closeLoginModal" class="close-btn" type="button" aria-label="Đóng">&times;</button>
                <h2 id="loginTitle">Đăng nhập tài khoản</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input id="loginEmail" name="email" type="email"
                               autocomplete="email" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Mật khẩu</label>
                        <input id="loginPassword" name="password" type="password"
                               autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                    </div>
                    <button class="btn-submit" type="submit">Đăng nhập</button>
                    <p class="login-note">Giao diện minh họa, chưa kết nối xác thực tài khoản.</p>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Bài Tập Lớn Thiết Kế Web. Nhóm Di Chuyển Thông Minh.</p>
    </footer>
</body>
</html>
